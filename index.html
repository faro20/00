<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-256</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea, input[type="password"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            resize: vertical;
            transition: border-color 0.2s ease;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-primary);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        .result-group {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .result-group.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .copy-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--accent-primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background-color: var(--border-color);
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .status-msg.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-msg.success {
            display: block;
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-group">
        <label for="inputText">Texto Cifrado (Base64)</label>
        <textarea id="inputText" rows="5" placeholder="Ingresa el texto encriptado en Base64..."></textarea>
    </div>

    <div class="form-group">
        <label for="secretKey">Clave Secreta / Password</label>
        <input type="password" id="secretKey" placeholder="Ingresa una clave segura...">
    </div>

    <button class="action-btn" id="actionBtn" onclick="processData()">Desencriptar Contenido</button>

    <div id="status" class="status-msg"></div>

    <div class="result-group" id="resultGroup">
        <div class="result-header">
            <label for="outputText">Resultado</label>
            <button class="copy-btn" onclick="copyResult()">Copiar Resultado</button>
        </div>
        <textarea id="outputText" rows="5" readonly></textarea>
    </div>
</div>

<script>
    async function getKeyMaterial(password) {
        const enc = new TextEncoder();
        return window.crypto.subtle.importKey(
            "raw",
            enc.encode(password),
            { name: "PBKDF2" },
            false,
            ["deriveBits", "deriveKey"]
        );
    }

    async function deriveKey(keyMaterial, salt, keyUsage) {
        return window.crypto.subtle.deriveKey(
            {
                "name": "PBKDF2",
                salt: salt,
                "iterations": 100000,
                "hash": "SHA-256"
            },
            keyMaterial,
            { "name": "AES-GCM", "length": 256 },
            false,
            keyUsage
        );
    }

    async function processData() {
        hideStatus();
        const input = document.getElementById('inputText').value;
        const password = document.getElementById('secretKey').value;

        if (!input || !password) {
            showStatus("Por favor ingresa tanto el texto como la clave secreta.", "error");
            return;
        }

        try {
            const decryptedText = await decryptData(input, password);
            document.getElementById('outputText').value = decryptedText;
            document.getElementById('resultGroup').classList.add('active');
            showStatus("¡Desencriptación completada con éxito!", "success");
        } catch (e) {
            console.error(e);
            showStatus("Error al desencriptar. Revisa la clave o el formato del texto.", "error");
        }
    }

    async function decryptData(base64Data, password) {
        const combined = new Uint8Array(atob(base64Data).split("").map(c => c.charCodeAt(0)));
        
        if (combined.length < 28) {
            throw new Error("Datos inválidos.");
        }

        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const data = combined.slice(28);

        const keyMaterial = await getKeyMaterial(password);
        const key = await deriveKey(keyMaterial, salt, ["decrypt"]);

        const decryptedContent = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            key,
            data
        );

        const dec = new TextDecoder();
        return dec.decode(decryptedContent);
    }

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = msg;
        statusDiv.className = `status-msg ${type}`;
    }

    function hideStatus() {
        const statusDiv = document.getElementById('status');
        statusDiv.className = 'status-msg';
    }

    function copyResult() {
        const outputText = document.getElementById('outputText');
        outputText.select();
        document.execCommand('copy');
        showStatus("¡Resultado copiado al portapapeles!", "success");
    }
</script>
</body>
</html>
